apiVersion: v1
kind: Namespace
metadata:
  name: pgops-lab
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pgops
  namespace: pgops-lab
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6
  failoverDelay: 0
  storage:
    size: 1Gi
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: "1"
  affinity:
    podAntiAffinityType: preferred
