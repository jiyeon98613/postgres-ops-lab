apiVersion: v1
kind: Pod
metadata:
  name: pgops-client
  namespace: pgops-lab
spec:
  containers:
    - name: client
      image: ghcr.io/cloudnative-pg/postgresql:18.6
      command: ["sleep", "infinity"]
      env:
        - name: PGHOST
          value: pgops-rw
        - name: PGDATABASE
          value: app
        - name: PGUSER
          value: app
        - name: PGCONNECT_TIMEOUT
          value: "2"
        - name: PGOPTIONS
          value: "-c statement_timeout=3000"
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: pgops-app
              key: password
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          cpu: 250m
          memory: 128Mi
